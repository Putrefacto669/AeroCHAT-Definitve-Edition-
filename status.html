<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estados — AeroChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/site.css"/>
</head>
<body>
<div id="acToast" class="toast" role="status" aria-live="polite"></div>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="chat-main status-main">
    <div class="chat-header">
      <button class="hamburger" onclick="openSidebar()" aria-label="Menú"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="chat-header-info">
        <div class="chat-header-name">Estados</div>
        <div class="chat-header-sub">Solo tus amigos pueden verlos</div>
      </div>
      <button class="btn btn-ghost btn-new-status" onclick="openNewStatus()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nuevo</button>
    </div>

    <div class="status-viewer" id="statusViewer">
      <div class="status-progress" id="statusProgress"></div>
      <div class="status-head">
        <span class="status-avatar" id="statusAvatar"></span>
        <div>
          <div class="status-name" id="statusName"></div>
          <div class="status-time" id="statusTime"></div>
        </div>
      </div>
      <div class="status-body" id="statusBody"></div>
      <div class="status-nav status-nav-prev" id="navPrev" title="Anterior"></div>
      <div class="status-nav status-nav-next" id="navNext" title="Siguiente"></div>
    </div>

    <div class="status-actions" id="statusActions">
      <button class="btn btn-ghost" id="replyBtn" onclick="openCompose('reply')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> Responder</button>
      <button class="btn btn-ghost" id="mentionBtn" onclick="openCompose('mention')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg> Mencionar</button>
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteStatus()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> Eliminar</button>
    </div>
  </div>
</div>

<!-- Compose modal (responder / mencionar) -->
<div class="modal-overlay" id="composeModal">
  <div class="modal">
    <h3 id="composeTitle">Responder</h3>
    <div class="field" id="mentionPickWrap" style="display:none">
      <label for="mentionPick">Elegí a quién mencionar</label>
      <select id="mentionPick" class="edit-textarea"></select>
    </div>
    <div class="field">
      <label for="composeText" id="composeLabel">Mensaje</label>
      <textarea id="composeText" class="edit-textarea" rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal('composeModal')">Cancelar</button>
      <button type="button" class="btn btn-primary" onclick="sendCompose()">Enviar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/aerochat.js"></script>
<script src="js/api.js"></script>
<script src="js/realtime.js"></script>
<script src="js/messages.js"></script>
<script src="js/stickers.js"></script>
<script src="js/calls.js"></script>
<script src="js/status.js"></script>
</body>
</html>
