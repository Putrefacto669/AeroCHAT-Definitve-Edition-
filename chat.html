<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chats — AeroChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/site.css"/>
</head>
<body>
<div id="acToast" class="toast" role="status" aria-live="polite"></div>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="chat-main">
    <div class="chat-header">
      <button class="hamburger" onclick="openSidebar()" aria-label="Menú">☰</button>
    </div>
    <div class="chat-empty">
      <div class="chat-empty-icon">✈</div>
      <h2>Seleccioná una conversación</h2>
      <p>Elegí un contacto del panel izquierdo para empezar.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/aerochat.js"></script>
<script src="js/api.js"></script>
<script src="js/realtime.js"></script>
<script src="js/messages.js"></script>
<script src="js/stickers.js"></script>
<script src="js/calls.js"></script>
<script>
  acInitApp(function () {
    acInitCalls();
    scrollToBottom();
  });
</script>
</body>
</html>
