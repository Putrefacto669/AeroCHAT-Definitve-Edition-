<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat — AeroChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/site.css"/>
</head>
<body>
<div id="acToast" class="toast" role="status" aria-live="polite"></div>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="chat-main">
    <div class="chat-header">
      <button class="hamburger" onclick="openSidebar()" aria-label="Menú"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <a href="#" id="headerLink" class="chat-header-link">
        <span id="headerAvatar" class="avatar avatar-md"></span>
        <div class="chat-header-info">
          <div class="chat-header-name">
            <span id="headerName">…</span>
            <span class="presence-dot" id="headerDot" data-userid=""></span>
          </div>
          <div class="chat-header-sub" id="headerSub"></div>
        </div>
      </a>
      <button class="icon-btn" title="Buscar" onclick="toggleSearch()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn icon-btn-call" title="Llamada de voz" id="callAudioBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button class="icon-btn icon-btn-call icon-btn-video" title="Videollamada" id="callVideoBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>
    </div>

    <div class="search-panel" id="searchPanel" hidden>
      <div class="search-panel-head">
        <span class="search-ic">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="searchInput" placeholder="Buscar en la conversación…" autocomplete="off"/>
        <span class="search-count" id="searchCount" hidden></span>
        <button type="button" class="icon-btn icon-btn-clear" onclick="closeSearch()" title="Cerrar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="search-panel-results" id="searchResults"></div>
    </div>

    <div class="messages-area" id="messages">
      <div class="no-messages">Nada por acá todavía — ¡arrancá la conversación!</div>
    </div>

    <div class="input-area">
      <div class="attach-panel" id="attachPanel">
        <div class="attach-options">
          <label class="attach-opt"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Imagen<input type="file" accept="image/*" onchange="acPickAttach('image', this)"/></label>
          <label class="attach-opt"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> Audio<input type="file" accept="audio/*" onchange="acPickAttach('audio', this)"/></label>
          <label class="attach-opt"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg> Video<input type="file" accept="video/*" onchange="acPickAttach('video', this)"/></label>
          <label class="attach-opt"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Documento<input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip" onchange="acPickAttach('document', this)"/></label>
          <label class="attach-opt"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="7" y1="9" x2="7" y2="15"/><line x1="11" y1="9" x2="11" y2="15"/><path d="M13 15v-6l3 3 3-3v6"/></svg> GIF<input type="file" accept="image/gif" onchange="acPickAttach('image', this)"/></label>
        </div>
      </div>

      <div class="reply-bar" id="replyBar"></div>

      <div class="sticker-panel" id="stickerPanel" hidden>
        <div class="sticker-import">
          <input type="text" id="stickerLink" placeholder="Pega el link del paquete sticker.ly…" autocomplete="off"/>
          <button type="button" class="sticker-import-btn" onclick="importStickerPack()">Importar</button>
        </div>
        <div class="sticker-hint">Cada paquete aparece como pestaña aparte y podés marcar favoritos con la estrella, como en WhatsApp.</div>
        <div class="sticker-tabs" id="stickerTabs"></div>
        <div class="sticker-panel-body" id="stickerPanelBody"></div>
      </div>

      <div class="gif-panel" id="gifPanel" hidden>
        <div class="gif-search">
          <input type="text" id="gifSearch" placeholder="Buscar GIFs…" autocomplete="off"/>
          <button type="button" class="gif-search-btn" onclick="gifSearchNow()">Buscar</button>
        </div>
        <div class="gif-results" id="gifResults"></div>
        <div class="gif-attr">Powered by GIPHY</div>
      </div>

      <div class="send-form" id="sendForm">
        <button type="button" class="icon-btn icon-btn-attach" onclick="toggleAttach()" title="Adjuntar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <button type="button" class="icon-btn icon-btn-sticker" onclick="toggleStickers()" title="Stickers">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"/><path d="M15 3v6h6"/><path d="M7 13h10"/><path d="M7 17h7"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn-gif" id="gifBtn" onclick="toggleGifs()" title="Enviar GIF"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="7" y1="9" x2="7" y2="15"/><line x1="11" y1="9" x2="11" y2="15"/><path d="M13 15v-6l3 3 3-3v6"/></svg></button>
        <input type="text" id="msgInput" placeholder="Mensaje…" autocomplete="off" class="msg-input"/>
        <button type="button" class="icon-btn icon-btn-mic" id="micBtn" title="Nota de voz" onclick="acStartRecording()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
        <div class="rec-bar" id="recBar" hidden>
          <span class="rec-dot"></span>
          <span class="rec-timer" id="recTimer">0:00</span>
          <span class="rec-hint">Grabando…</span>
          <button type="button" class="rec-cancel" title="Cancelar" onclick="acStopRecording(false)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          <button type="button" class="rec-send" title="Enviar" onclick="acStopRecording(true)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
        </div>
        <button type="button" class="icon-btn icon-btn-send" id="sendBtn" title="Enviar"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </div>
      <div id="typingIndicator" class="typing-indicator"></div>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>Editar mensaje</h3>
    <div>
      <input type="hidden" id="editMsgId"/>
      <textarea id="editContent" class="edit-textarea"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('editModal')">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="submitEdit()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>Eliminar mensaje</h3>
    <p>Esta acción no se puede deshacer.</p>
    <div>
      <input type="hidden" id="deleteMsgId"/>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancelar</button>
        <button type="button" class="btn btn-danger" onclick="submitDelete()">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt=""/>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/aerochat.js"></script>
<script src="js/api.js"></script>
<script src="js/realtime.js"></script>
<script src="js/notify.js"></script>
<script src="js/messages.js"></script>
<script src="js/stickers.js"></script>
<script src="js/gifs.js"></script>
<script src="js/calls.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
